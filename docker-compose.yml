version: '3.8'

services:
  yolo-editor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_editor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      # Verilerin sunucuda kalici olmasi icin baglanti
      - .:/app
    # GPU bulunan sunucularda aktif edebilirsiniz:
