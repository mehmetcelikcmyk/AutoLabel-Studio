version: '3.8'

services:
  yolo-editor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_editor_app
    restart: unless-stopped
    ports:
      # The application must only be reachable through the TLS reverse proxy.
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - HOST=0.0.0.0
      - PORT=8000
    read_only: true
    tmpfs:
      - /tmp
