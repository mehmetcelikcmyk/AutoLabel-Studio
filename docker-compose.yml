version: '3.8'

services:
  yolo-editor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yolo_editor_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      # Verilerin sunucuda kalıcı olması için ana klasörü bağlıyoruz
      - .:/app
